# Example: GKE with managed services (Cloud SQL, Memorystore, GCS, Vertex AI)
# and a GPU node pool. Secrets come from an existing Kubernetes Secret, filled
# by External Secrets Operator from Secret Manager.
#
#   helm upgrade --install platform deploy/helm/bayes-platform \
#     -n platform --create-namespace -f my-values.yaml

global:
  image:
    # Public images from GitHub Container Registry (the default), pinned to a release.
    tag: "26.09.1"

urls:
  api: https://staging.example.org
  web: https://staging.example.org
  webEmbed: https://embed.staging.example.org
  help: https://help.staging.example.org

serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: platform-api@my-project.iam.gserviceaccount.com

secrets:
  existingSecret: platform-secrets

config:
  OIDC_ISSUER_URL: https://idp.example.org/realms/platform
  OIDC_AUDIENCE: ""
  ORGANIZATION_CREATOR_EMAIL_DOMAIN: "@example.org"
  BACKOFFICE_AUTHORIZED_DOMAIN: "@example.org"
  GOOGLE_VERTEX_PROJECT: my-project
  GOOGLE_VERTEX_LOCATION: europe-west1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway.observability:4318
  TRACE_URL_TEMPLATE: https://traces.example.org/redirects/sessions/{traceId}

postgresql:
  enabled: false
externalDatabase:
  # Private IP of the Cloud SQL instance, or 127.0.0.1 with a Cloud SQL Auth
  # Proxy sidecar. The `vector` extension must exist in the database.
  host: 10.20.0.3
  database: platform
  username: platform

redis:
  enabled: false
# BULLMQ_REDIS_URL is read from the secret: rediss://:<auth string>@<ip>:6378
# for Memorystore with in-transit encryption, whose CA certificate goes in the
# secret too.
externalRedis:
  sslCaSecretKey: BULLMQ_REDIS_TLS_CA

storage:
  mode: gcs
  gcs:
    bucket: my-project-platform-files

gpuWorkers:
  enabled: true
  gpu:
    nodeSelector:
      cloud.google.com/gke-accelerator: nvidia-l4
    # GKE mounts the driver libraries here without putting them on the loader path.
    driverLibraryPath: /usr/local/nvidia/lib64

web:
  env:
    WEB_APP_TITLE: My platform
    WEB_OIDC_CLIENT_ID: platform-web

ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod
  tls: true
