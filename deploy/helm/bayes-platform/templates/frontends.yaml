{{- /*
Two static front ends served by nginx on port 8080: web-embed and help.
Their configuration is injected at container start (see apps/<app>/docker).
The main web front is served by the API itself (see api.yaml).
*/ -}}
{{- $root := . }}
{{- $fronts := list }}
{{- if .Values.webEmbed.enabled }}
  {{- $fronts = append $fronts (dict "component" "web-embed" "values" .Values.webEmbed "env" (dict "VITE_API_URL" .Values.urls.api)) }}
{{- end }}
{{- if .Values.help.enabled }}
  {{- $helpTheme := ternary .Values.help.theme dict .Values.help.theme.enabled }}
  {{- $fronts = append $fronts (dict "component" "help" "values" .Values.help "env" (dict "PUBLIC_APP_URL" .Values.urls.web "PUBLIC_API_BASE_URL" .Values.urls.api "PUBLIC_SITE_URL" .Values.urls.help) "theme" $helpTheme) }}
{{- end }}
{{- range $front := $fronts }}
{{- $values := $front.values }}
{{- $name := include "bayes-platform.componentName" (dict "root" $root "component" $front.component) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bayes-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $front.component }}
spec:
  replicas: {{ $values.replicas }}
  selector:
    matchLabels:
      {{- include "bayes-platform.selectorLabels" (dict "root" $root "component" $front.component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bayes-platform.selectorLabels" (dict "root" $root "component" $front.component) | nindent 8 }}
      annotations:
        checksum/env: {{ toYaml $front.env | sha256sum }}
        {{- if $front.theme }}
        checksum/theme: {{ toYaml $front.theme | sha256sum }}
        {{- end }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # nginx-unprivileged runs as user nginx (uid 101); runAsNonRoot needs a number.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          image: {{ include "bayes-platform.image" (dict "root" $root "image" $values.image) }}
          imagePullPolicy: {{ $root.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $key, $value := $front.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          {{- if $front.theme }}
          # The tenant theme over the image's theme/ folder (one file, theme.css).
          volumeMounts:
            - name: theme
              mountPath: /usr/share/nginx/html/theme
              readOnly: true
      volumes:
        - name: theme
          configMap:
            name: {{ $name }}-theme
          {{- end }}
{{- if $front.theme }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-theme
  labels:
    {{- include "bayes-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $front.component }}
data:
  theme.css: |
    {{- $front.theme.css | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bayes-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $front.component }}
spec:
  type: ClusterIP
  selector:
    {{- include "bayes-platform.selectorLabels" (dict "root" $root "component" $front.component) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
