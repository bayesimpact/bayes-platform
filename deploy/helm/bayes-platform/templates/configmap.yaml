apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bayes-platform.componentName" (dict "root" . "component" "config") }}
  labels:
    {{- include "bayes-platform.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
