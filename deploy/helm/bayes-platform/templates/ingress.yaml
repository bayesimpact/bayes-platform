{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- $rules := list }}
{{- $apiService := include "bayes-platform.componentName" (dict "root" $root "component" "api") }}
{{- $webHost := include "bayes-platform.host" .Values.urls.web }}
{{- $apiHost := include "bayes-platform.host" .Values.urls.api }}
{{- /*
The api Deployment serves three surfaces on one process: the web front at /,
the private API under /api, the public API under /public.
- The web host (urls.web) gets all three: the front calls /api on its own origin.
- When urls.api names another host, that host gets the API surfaces only, /api
  and /public, never the front: it is the URL given to integrators.
Both carry ingress.apiAnnotations (uploads, long answers).
*/}}
{{- if .Values.api.enabled }}
  {{- $rules = append $rules (dict "name" $apiService "component" "api" "host" $webHost "paths" (list "/") "service" $apiService "port" .Values.api.port "annotations" .Values.ingress.apiAnnotations) }}
  {{- if ne $apiHost $webHost }}
  {{- $rules = append $rules (dict "name" (printf "%s-host" $apiService) "component" "api" "host" $apiHost "paths" (list "/api" "/public") "service" $apiService "port" .Values.api.port "annotations" .Values.ingress.apiAnnotations) }}
  {{- end }}
  {{- /*
  /api/healthz is for the kubelet, which reaches the pod directly: it queries
  the database on every call and would tell the Internet which version runs.
  A separate Ingress per API host carries that exact path with a source
  whitelist (ingress.healthzAllowFrom, nobody by default): ingress-nginx gives
  the path its own location, 403 for everyone else. The other paths are not
  affected. No TLS block on it: the host's certificate comes from the main
  Ingress, a second one would order a second certificate.
  */}}
  {{- $healthzAnnotations := dict "nginx.ingress.kubernetes.io/whitelist-source-range" .Values.ingress.healthzAllowFrom }}
  {{- $rules = append $rules (dict "name" (printf "%s-healthz" $apiService) "component" "api" "host" $webHost "paths" (list "/api/healthz") "pathType" "Exact" "noTLS" true "service" $apiService "port" .Values.api.port "annotations" $healthzAnnotations) }}
  {{- if ne $apiHost $webHost }}
  {{- $rules = append $rules (dict "name" (printf "%s-host-healthz" $apiService) "component" "api" "host" $apiHost "paths" (list "/api/healthz") "pathType" "Exact" "noTLS" true "service" $apiService "port" .Values.api.port "annotations" $healthzAnnotations) }}
  {{- end }}
{{- end }}
{{- if .Values.webEmbed.enabled }}
  {{- $s := include "bayes-platform.componentName" (dict "root" $root "component" "web-embed") }}
  {{- $rules = append $rules (dict "name" $s "component" "web-embed" "host" (include "bayes-platform.host" .Values.urls.webEmbed) "paths" (list "/") "service" $s "port" 80 "annotations" dict) }}
{{- end }}
{{- if .Values.help.enabled }}
  {{- $s := include "bayes-platform.componentName" (dict "root" $root "component" "help") }}
  {{- $rules = append $rules (dict "name" $s "component" "help" "host" (include "bayes-platform.host" .Values.urls.help) "paths" (list "/") "service" $s "port" 80 "annotations" dict) }}
{{- end }}
{{- range $rule := $rules }}
---
# One Ingress per host, so each component can carry its own annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $rule.name }}
  labels:
    {{- include "bayes-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $rule.component }}
  annotations:
    {{- if and $root.Values.ingress.clusterIssuer (not $rule.noTLS) }}
    cert-manager.io/cluster-issuer: {{ $root.Values.ingress.clusterIssuer }}
    {{- end }}
    {{- with $root.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $rule.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $root.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if and $root.Values.ingress.tls (not $rule.noTLS) }}
  tls:
    - hosts:
        - {{ $rule.host }}
      secretName: {{ $rule.name }}-tls
  {{- end }}
  rules:
    - host: {{ $rule.host }}
      http:
        paths:
          {{- range $path := $rule.paths }}
          - path: {{ $path }}
            pathType: {{ $rule.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $rule.service }}
                port:
                  number: {{ $rule.port }}
          {{- end }}
{{- end }}
{{- end }}
