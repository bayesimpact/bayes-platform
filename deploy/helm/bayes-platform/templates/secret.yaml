{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Development only: the values are stored in the Helm release.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bayes-platform.secretName" . }}
  labels:
    {{- include "bayes-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
# Password of the bundled Postgres. Generated once, kept across upgrades.
{{- $secretName := include "bayes-platform.postgresqlSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.postgresql.auth.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "bayes-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
