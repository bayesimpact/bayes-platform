{{- if and .Values.embedder.enabled (not .Values.embedder.url) }}
{{- $name := include "bayes-platform.componentName" (dict "root" . "component" "embedder") }}
{{- $values := .Values.embedder }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bayes-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedder
spec:
  replicas: {{ $values.replicas }}
  selector:
    matchLabels:
      {{- include "bayes-platform.selectorLabels" (dict "root" . "component" "embedder") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bayes-platform.selectorLabels" (dict "root" . "component" "embedder") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "bayes-platform.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: embedder
          image: {{ include "bayes-platform.image" (dict "root" . "image" $values.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $values.port }}
          env:
            - name: PORT
              value: {{ $values.port | quote }}
            - name: EMBEDDER_MODELS
              value: {{ $values.models | quote }}
            - name: EMBEDDER_DEVICE
              value: {{ ternary "cuda" "cpu" $values.gpu.enabled | quote }}
            {{- with $values.gpu.driverLibraryPath }}
            - name: LD_LIBRARY_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- if $values.apiKeySecretKey }}
            - name: EMBEDDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bayes-platform.secretName" . }}
                  key: {{ $values.apiKeySecretKey }}
            {{- end }}
          # Loading the weights takes a while on CPU: readiness gates the traffic.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- if $values.gpu.enabled }}
            requests:
              {{- toYaml $values.resources.requests | nindent 14 }}
              nvidia.com/gpu: {{ $values.gpu.count }}
            limits:
              {{- toYaml $values.resources.limits | nindent 14 }}
              nvidia.com/gpu: {{ $values.gpu.count }}
            {{- else }}
            {{- toYaml $values.resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
      {{- $nodeSelector := ternary $values.gpu.nodeSelector $values.nodeSelector $values.gpu.enabled }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $values.tolerations $values.gpu.enabled }}
      tolerations:
        {{- with $values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $values.gpu.enabled }}
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bayes-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedder
spec:
  type: ClusterIP
  selector:
    {{- include "bayes-platform.selectorLabels" (dict "root" . "component" "embedder") | nindent 4 }}
  ports:
    - name: http
      port: {{ $values.port }}
      targetPort: http
{{- end }}
