<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF download</title>
<style>
  /* The card follows the host's theme (hostContext.theme), never the OS
     preference: the chat around it decides whether the page is light or dark.
     Light is the default until the host says otherwise. */
  :root {
    color-scheme: light;
    --surface: #ffffff;
    --border: #e2e2e5;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #111111;
    --accent-text: #ffffff;
    --icon: #6b6b70;
    --icon-bg: #f2f2f4;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1f1f22;
    --border: #35353a;
    --text: #f2f2f4;
    --muted: #a1a1a8;
    --accent: #f2f2f4;
    --accent-text: #111111;
    --icon: #a1a1a8;
    --icon-bg: #2a2a2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 4px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
  }
  .icon {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--icon-bg);
    color: var(--icon);
  }
  .details { flex: 1 1 auto; min-width: 0; }
  .name {
    margin: 0;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .meta, .expiry {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  .button {
    flex: 0 0 auto;
    display: inline-block;
    padding: 7px 12px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    text-decoration: none;
  }
  .button[aria-disabled="true"] {
    background: var(--icon-bg);
    color: var(--muted);
    cursor: default;
  }
  [hidden] { display: none; }
</style>
</head>
<body>
<div class="card">
  <span class="icon" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
      <path d="M14 3v5h5"></path>
      <path d="M9 13h6"></path>
      <path d="M9 17h4"></path>
    </svg>
  </span>
  <div class="details">
    <p class="name" id="name">Preparing your PDF</p>
    <p class="meta" id="meta">The document is being generated.</p>
    <p class="expiry" id="expiry" hidden></p>
  </div>
  <a class="button" id="download" hidden target="_blank" rel="noopener noreferrer">Download PDF</a>
</div>
<script>
(() => {
  "use strict";

  var PROTOCOL_VERSION = "2026-01-26";
  var INITIALIZE_ID = 1;

  // The card speaks the host's language: hostContext.locale carries the
  // agent's configured language (a BCP 47 tag), and every visible string is
  // picked from this dictionary at render time. English is the fallback for a
  // missing or unknown locale.
  var MESSAGES = {
    en: {
      preparingTitle: "Preparing your PDF",
      preparingNamedTitle: "Preparing {name}…",
      preparingDetail: "The document is being generated.",
      download: "Download PDF",
      defaultFileName: "document.pdf",
      page: "page",
      pages: "pages",
      expiresIn: "Link expires in {countdown}",
      expired: "Link expired, ask the agent to export again",
      linkUnavailable: "Download link unavailable, ask the agent to export again",
      failedTitle: "PDF export failed",
      failedDetail: "The export did not complete.",
      readyTitle: "PDF ready",
      readyDetail: "The document was generated.",
      cancelledTitle: "PDF export cancelled",
      cancelledDetail: "Ask the agent to export again.",
      cardUnavailableTitle: "PDF download card unavailable",
      cardUnavailableDetail: "Ask the agent for the download link.",
      megabytes: "{value} MB",
      kilobytes: "{value} KB",
      bytes: "{value} B",
      decimalSeparator: "."
    },
    fr: {
      preparingTitle: "Préparation de votre PDF",
      preparingNamedTitle: "Préparation de {name}…",
      preparingDetail: "Le document est en cours de génération.",
      download: "Télécharger le PDF",
      defaultFileName: "document.pdf",
      page: "page",
      pages: "pages",
      expiresIn: "Le lien expire dans {countdown}",
      expired: "Lien expiré, demandez à l’agent de refaire l’export",
      linkUnavailable: "Lien de téléchargement indisponible, demandez à l’agent de refaire l’export",
      failedTitle: "L’export PDF a échoué",
      failedDetail: "L’export ne s’est pas terminé.",
      readyTitle: "PDF prêt",
      readyDetail: "Le document a été généré.",
      cancelledTitle: "Export PDF annulé",
      cancelledDetail: "Demandez à l’agent de refaire l’export.",
      cardUnavailableTitle: "Carte de téléchargement indisponible",
      cardUnavailableDetail: "Demandez le lien de téléchargement à l’agent.",
      megabytes: "{value} Mo",
      kilobytes: "{value} Ko",
      bytes: "{value} o",
      decimalSeparator: ","
    }
  };

  var nameEl = document.getElementById("name");
  var metaEl = document.getElementById("meta");
  var expiryEl = document.getElementById("expiry");
  var downloadEl = document.getElementById("download");

  var locale = "en";
  var expiresAtMs = 0;
  var countdownTimer = null;
  // What the card currently shows, kept so a locale change can redraw it:
  // { kind: "preparing", fileName } | { kind: "result", output } |
  // { kind: "status", titleKey, detailKey, detail } where a non-empty
  // `detail` (text sent by the server) wins over the translated `detailKey`.
  var state = { kind: "preparing", fileName: "" };

  function send(message) {
    window.parent.postMessage(message, "*");
  }

  function sendSizeChanged() {
    send({
      jsonrpc: "2.0",
      method: "ui/notifications/size-changed",
      params: { height: Math.ceil(document.documentElement.getBoundingClientRect().height) }
    });
  }

  // setLocale maps a BCP 47 tag onto a supported language and reports whether
  // the card's language changed. Anything that is not French renders English.
  function setLocale(value) {
    var next = typeof value === "string" && /^fr(?![a-z])/i.test(value) ? "fr" : "en";
    if (next === locale) {
      return false;
    }
    locale = next;
    document.documentElement.lang = next;
    return true;
  }

  function text(key, values) {
    var template = MESSAGES[locale][key];
    return template.replace(/\{(\w+)\}/g, (match, name) => values && values[name] !== undefined ? String(values[name]) : match);
  }

  function formatSize(bytes) {
    var megabytes;
    if (typeof bytes !== "number" || !Number.isFinite(bytes) || bytes < 0) {
      return "";
    }
    if (bytes >= 1024 * 1024) {
      megabytes = (bytes / (1024 * 1024)).toFixed(1).replace(".", text("decimalSeparator"));
      return text("megabytes", { value: megabytes });
    }
    if (bytes >= 1024) {
      return text("kilobytes", { value: Math.round(bytes / 1024) });
    }
    return text("bytes", { value: bytes });
  }

  function formatCountdown(milliseconds) {
    var totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;
    return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
  }

  function stopCountdown() {
    if (countdownTimer !== null) {
      window.clearInterval(countdownTimer);
      countdownTimer = null;
    }
  }

  // safeHttpsUrl returns value when it parses as an absolute https: URL, and
  // null otherwise (missing, malformed, or any other scheme such as
  // javascript:). Only a value that passes this check is ever set as the
  // download link's href, which is the card's single download path: the anchor
  // navigates natively from the user's own click.
  function safeHttpsUrl(value) {
    if (typeof value !== "string" || value === "") {
      return null;
    }
    var parsed;
    try {
      parsed = new URL(value);
    } catch (_error) {
      return null;
    }
    return parsed.protocol === "https:" ? value : null;
  }

  // disableDownload puts the button in its non-interactive state with an
  // explanatory line, used both when the link has expired and when the host
  // sent no usable download URL at all.
  function disableDownload(message) {
    stopCountdown();
    downloadEl.removeAttribute("href");
    downloadEl.setAttribute("aria-disabled", "true");
    expiryEl.textContent = message;
    expiryEl.hidden = false;
    sendSizeChanged();
  }

  function markExpired() {
    disableDownload(text("expired"));
  }

  function tickCountdown() {
    var remaining = expiresAtMs - Date.now();
    if (remaining <= 0) {
      markExpired();
      return;
    }
    expiryEl.textContent = text("expiresIn", { countdown: formatCountdown(remaining) });
    expiryEl.hidden = false;
  }

  // renderStatus shows a single-line state (preparing, cancelled, failure).
  function renderStatus(title, detail) {
    nameEl.textContent = title;
    metaEl.textContent = detail;
    metaEl.hidden = detail === "";
    expiryEl.hidden = true;
    downloadEl.hidden = true;
    downloadEl.removeAttribute("href");
    downloadEl.removeAttribute("aria-disabled");
    sendSizeChanged();
  }

  // renderResult is idempotent: the host may re-send the same tool result.
  function renderResult(output) {
    var parts = [];
    if (typeof output.pageCount === "number" && output.pageCount > 0) {
      parts.push(`${output.pageCount} ${text(output.pageCount === 1 ? "page" : "pages")}`);
    }
    var size = formatSize(output.sizeBytes);
    if (size !== "") {
      parts.push(size);
    }

    nameEl.textContent = output.fileName || text("defaultFileName");
    metaEl.textContent = parts.join(" · ");
    metaEl.hidden = parts.length === 0;

    downloadEl.hidden = false;
    var safeUrl = safeHttpsUrl(output.downloadUrl);
    if (!safeUrl) {
      disableDownload(text("linkUnavailable"));
      return;
    }
    downloadEl.removeAttribute("aria-disabled");
    downloadEl.setAttribute("href", safeUrl);

    var parsedExpiry = Date.parse(output.expiresAt);
    if (Number.isFinite(parsedExpiry)) {
      expiresAtMs = parsedExpiry;
      if (Date.now() >= expiresAtMs) {
        markExpired();
        return;
      }
      tickCountdown();
      countdownTimer = window.setInterval(tickCountdown, 1000);
    } else {
      expiryEl.hidden = true;
    }
    sendSizeChanged();
  }

  // render draws the current state in the current language. It is the only
  // place that turns a state into DOM, so a locale change simply calls it
  // again.
  function render() {
    stopCountdown();
    downloadEl.textContent = text("download");
    if (state.kind === "result") {
      renderResult(state.output);
      return;
    }
    if (state.kind === "preparing") {
      renderStatus(
        state.fileName !== ""
          ? text("preparingNamedTitle", { name: state.fileName })
          : text("preparingTitle"),
        text("preparingDetail")
      );
      return;
    }
    renderStatus(text(state.titleKey), state.detail !== "" ? state.detail : text(state.detailKey));
  }

  function show(nextState) {
    state = nextState;
    render();
  }

  function showStatus(titleKey, detailKey, detail) {
    show({ kind: "status", titleKey: titleKey, detailKey: detailKey, detail: detail || "" });
  }

  function firstTextContent(content) {
    if (!Array.isArray(content)) {
      return "";
    }
    var index;
    var item;
    for (index = 0; index < content.length; index += 1) {
      item = content[index];
      if (item && typeof item.text === "string" && item.text !== "") {
        return item.text;
      }
    }
    return "";
  }

  function onToolResult(result) {
    if (!result || typeof result !== "object") {
      return;
    }
    if (result.isError) {
      showStatus("failedTitle", "failedDetail", firstTextContent(result.content));
      return;
    }
    var output = result.structuredContent;
    if (!output || typeof output !== "object") {
      showStatus("readyTitle", "readyDetail", firstTextContent(result.content));
      return;
    }
    show({ kind: "result", output: output });
  }

  function onNotification(method, params) {
    var args;
    var fileName;
    if (method === "ui/notifications/tool-input") {
      args = params?.arguments;
      fileName = args && typeof args.fileName === "string" ? args.fileName : "";
      show({ kind: "preparing", fileName: fileName });
      return;
    }
    if (method === "ui/notifications/tool-result") {
      onToolResult(params);
      return;
    }
    if (method === "ui/notifications/tool-cancelled") {
      showStatus("cancelledTitle", "cancelledDetail");
      return;
    }
    if (method === "ui/notifications/host-context-changed") {
      applyHostContext(params);
      return;
    }
    // Anything else: nothing to do.
  }

  // Light unless the host explicitly says dark; the OS preference is ignored
  // because the surrounding chat, not the OS, sets the page's colours.
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
  }

  // applyHostContext takes the full context from ui/initialize or the partial
  // one from host-context-changed: only the fields present are applied.
  function applyHostContext(hostContext) {
    if (!hostContext || typeof hostContext !== "object") {
      return;
    }
    if (hostContext.theme !== undefined) {
      applyTheme(hostContext.theme);
    }
    if (hostContext.locale !== undefined && setLocale(hostContext.locale)) {
      render();
    }
  }

  function onHostRequest(id, method) {
    if (method === "ping" || method === "ui/resource-teardown") {
      if (method === "ui/resource-teardown") {
        stopCountdown();
      }
      send({ jsonrpc: "2.0", id: id, result: {} });
      return;
    }
    send({
      jsonrpc: "2.0",
      id: id,
      error: { code: -32601, message: `method not found: ${method}` }
    });
  }

  function onInitializeResponse(message) {
    if (message.error) {
      showStatus("cardUnavailableTitle", "cardUnavailableDetail");
      return;
    }
    var hostContext = message.result?.hostContext;
    // Light stays the default when the host sends no theme at all.
    applyTheme(hostContext?.theme);
    applyHostContext(hostContext);
    send({ jsonrpc: "2.0", method: "ui/notifications/initialized" });
  }

  function onMessage(event) {
    if (event.source !== window.parent) {
      return;
    }
    var message = event.data;
    if (!message || message.jsonrpc !== "2.0") {
      return;
    }
    if (typeof message.method === "string" && message.id === undefined) {
      onNotification(message.method, message.params);
      return;
    }
    if (typeof message.method === "string") {
      onHostRequest(message.id, message.method);
      return;
    }
    if (message.id === INITIALIZE_ID) {
      onInitializeResponse(message);
    }
  }

  window.addEventListener("message", onMessage);

  if (typeof window.ResizeObserver === "function") {
    new window.ResizeObserver(sendSizeChanged).observe(document.documentElement);
  }

  render();
  send({
    jsonrpc: "2.0",
    id: INITIALIZE_ID,
    method: "ui/initialize",
    params: {
      appInfo: { name: "pdf-export-download-card", version: "1.0.0" },
      appCapabilities: {},
      protocolVersion: PROTOCOL_VERSION
    }
  });
})();
</script>
</body>
</html>
