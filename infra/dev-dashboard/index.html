<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worktree environments</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --border: #e1e4e8;
    --accent: #2f6fde;
    --ready: #1f9d55;
    --starting: #d69e2e;
    --problem: #d64545;
    --stopped: #9aa5b1;
    --hover: #f1f3f5;
    --shadow: 0 4px 12px rgb(0 0 0 / 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b;
      --card: #1b2128;
      --text: #e4e7eb;
      --muted: #9aa5b1;
      --border: #2c343d;
      --accent: #6ea8fe;
      --hover: #262d36;
      --shadow: 0 4px 12px rgb(0 0 0 / 0.45);
    }
  }
  * { box-sizing: border-box; }
  code { font-family: ui-monospace, monospace; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { max-width: 72rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0; color: var(--muted); font-weight: 600; }
  .header-side { display: grid; justify-items: end; gap: 0.35rem; }
  .shared-title { display: flex; align-items: center; gap: 0.5rem; }
  .shared-title h2 { font-size: 0.85rem; font-weight: 500; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .title { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .title strong { font-size: 1.1rem; overflow-wrap: anywhere; }
  .description { margin: -0.35rem 0 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  .description.missing { font-size: 0.8rem; color: var(--muted); }
  .branch { font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
  .pill { font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.55rem; border-radius: 999px; color: #fff; white-space: nowrap; }
  .pill.ready { background: var(--ready); }
  .pill.starting { background: var(--starting); }
  .pill.problem { background: var(--problem); }
  .pill.stopped { background: var(--stopped); }
  .open { position: relative; display: inline-flex; align-self: flex-start; }
  .open > a, .open > button { display: inline-flex; align-items: center; height: 2rem; font: inherit; font-size: 0.85rem; font-weight: 500; color: var(--text); background: var(--card); border: 1px solid var(--border); cursor: pointer; text-decoration: none; }
  .open > a { gap: 0.4rem; padding: 0 0.85rem; border-radius: 6px 0 0 6px; }
  .open > a:only-child { border-radius: 6px; }
  .open > button { padding: 0 0.5rem; border-left: 0; border-radius: 0 6px 6px 0; color: var(--muted); }
  .open > a:hover, .open > button:hover, .open > button[aria-expanded="true"] { background: var(--hover); text-decoration: none; }
  .menu { position: absolute; left: 0; top: calc(100% + 0.3rem); z-index: 10; min-width: 11rem; display: grid; padding: 0.25rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
  .menu[hidden] { display: none; }
  .menu a { color: var(--text); font-size: 0.85rem; padding: 0.35rem 0.5rem; border-radius: 4px; text-decoration: none; }
  .menu a:hover, .menu a:focus-visible { background: var(--hover); outline: none; text-decoration: none; }
  .services { display: flex; flex-wrap: wrap; gap: 0.35rem 0.8rem; font-size: 0.8rem; color: var(--muted); }
  .dot { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; margin-right: 0.3rem; vertical-align: 0.05rem; }
  .dot.healthy, .dot.running, .dot.done { background: var(--ready); }
  .dot.starting { background: var(--starting); }
  .dot.unhealthy, .dot.failed, .dot.dead { background: var(--problem); }
  .dot.stopped, .dot.unknown, .dot.paused { background: var(--stopped); }
  .status { position: relative; }
  .status > .pill { border: 0; font-family: inherit; cursor: default; }
  .popover { display: none; position: absolute; right: 0; top: 100%; z-index: 10; padding-top: 0.4rem; }
  .status:hover .popover, .status:focus-within .popover { display: block; }
  .popover .services { width: max-content; max-width: min(20rem, 80vw); background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 0.6rem 0.75rem; }
  /* The header wraps on a phone: the shared stack goes to the left, its popover opens rightwards. */
  @media (max-width: 40rem) {
    .header-side { justify-items: start; }
    .header-side .shared-title { position: relative; }
    .header-side .status { position: static; }
    .header-side .popover { left: 0; right: auto; }
  }
  .details { font-size: 0.8rem; color: var(--muted); display: grid; gap: 0.6rem; }
  .field { display: grid; gap: 0.25rem; }
  .field label { font-weight: 500; color: var(--text); }
  .field input { font: 0.8rem ui-monospace, monospace; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.55rem; width: 100%; min-width: 0; text-overflow: ellipsis; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .new { display: grid; gap: 0.6rem; width: fit-content; max-width: 100%; margin-bottom: 1.5rem; font-size: 0.85rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; }
  .new-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .new input { font: inherit; height: 2rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0 0.6rem; width: 16rem; max-width: 100%; }
  .new input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .new button { font: inherit; font-weight: 500; height: 2rem; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 0 0.85rem; cursor: pointer; }
  .new button:disabled { opacity: 0.5; cursor: default; }
  .new output { color: var(--muted); overflow-wrap: anywhere; max-width: 32rem; }
  .new output:empty { display: none; }
  .empty, .error { background: var(--card); border: 1px dashed var(--border); border-radius: 10px; padding: 1.25rem; color: var(--muted); }
  .error { border-color: var(--problem); color: var(--problem); }
  .who { font-size: 0.8rem; color: var(--muted); }
  .who button, .link-button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .actions button, .service-row button { font: inherit; font-size: 0.8rem; font-weight: 500; height: 1.85rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0 0.65rem; cursor: pointer; }
  .actions button:hover:not(:disabled), .service-row button:hover:not(:disabled) { background: var(--hover); }
  .actions button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .actions button.danger { color: var(--problem); }
  .actions button:disabled, .service-row button:disabled { opacity: 0.55; cursor: progress; }
  .service-row button { height: 1.5rem; font-size: 0.75rem; padding: 0 0.5rem; }
  .owned summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); }
  .service-rows { display: grid; gap: 0.1rem; margin-top: 0.4rem; }
  .service-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; padding: 0.1rem 0.25rem; border-radius: 4px; }
  .service-row:hover { background: var(--hover); }
  .service-row .name { flex: 1; }
  .service-row .health { color: var(--muted); font-size: 0.75rem; }
  .notice { font-size: 0.8rem; color: var(--problem); overflow-wrap: anywhere; }
  .running { font-size: 0.8rem; color: var(--starting); }
  dialog { width: min(60rem, 94vw); max-height: 85vh; padding: 0; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgb(0 0 0 / 0.35); }
  .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); }
  .dialog-head strong { overflow-wrap: anywhere; }
  .dialog-head button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.2rem 0.7rem; cursor: pointer; }
  dialog pre { margin: 0; padding: 0.8rem 1rem; height: 60vh; overflow: auto; font: 0.78rem/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Worktree environments</h1>
    <div class="header-side">
      <span class="who" id="who"></span>
      <span class="meta" id="updated"></span>
      <div class="shared-title">
        <h2>Shared stack</h2>
        <div id="shared"></div>
      </div>
    </div>
  </header>
  <form class="new" id="new-worktree">
    <div class="new-row">
      <input id="new-name" aria-label="Name or issue number" placeholder="name or issue number" autocomplete="off" spellcheck="false">
      <input id="new-description" aria-label="What it is for" placeholder="what it is for (optional)" autocomplete="off">
      <button type="submit" id="new-copy" disabled>New worktree</button>
    </div>
    <output id="new-command"></output>
  </form>
  <div id="error"></div>
  <section class="grid" id="environments"></section>
</main>
<dialog id="output">
  <div class="dialog-head">
    <strong id="output-title"></strong>
    <button type="button" id="output-close">Close</button>
  </div>
  <pre id="output-text"></pre>
</dialog>
<script>
  const LINK_LABELS = {
    app: "App",
    "bull-board": "Bull Board",
    grafana: "Grafana",
    storybook: "Storybook",
    "ui-storybook": "UI Storybook",
    embed: "Embed",
    "embed-storybook": "Embed Storybook",
    help: "Help",
    dex: "Dex",
  }
  const STATE_LABELS = { ready: "ready", starting: "starting", problem: "problem", stopped: "stopped" }

  function element(tag, properties = {}, children = []) {
    const node = document.createElement(tag)
    for (const [key, value] of Object.entries(properties)) {
      if (key === "className") node.className = value
      else if (key === "text") node.textContent = value
      else node.setAttribute(key, value)
    }
    for (const child of children) if (child) node.append(child)
    return node
  }

  function link(name, url) {
    return element("a", { href: url, target: "_blank", rel: "noopener", text: LINK_LABELS[name] ?? name })
  }

  // --- Buttons: the caller's daemon (wt serve), through the gateway of /api (docs/adr/0026) ----
  // `npm run wt -- login` gives a link with the token in its fragment, which no request carries.
  // The page keeps it in its own storage, which no other origin reads, and drops the fragment.
  const TOKEN_KEY = "wt-token"
  const fragment = new URLSearchParams(location.hash.slice(1))
  const fragmentToken = fragment.get("token")
  // The menu bar app opens a job's output here: #job=<id>.
  const fragmentJob = fragment.get("job")
  if (fragmentToken || fragmentJob) history.replaceState(null, "", location.pathname)
  if (fragmentToken) {
    try {
      localStorage.setItem(TOKEN_KEY, fragmentToken)
    } catch {}
  }
  function token() {
    try {
      return localStorage.getItem(TOKEN_KEY)
    } catch {
      return null
    }
  }

  async function api(path, { method = "GET", body } = {}) {
    const response = await fetch(path, {
      method,
      cache: "no-store",
      headers: { "x-wt-token": token() ?? "", ...(body ? { "content-type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    })
    const answer = response.headers.get("content-type")?.includes("json") ? await response.json() : {}
    if (!response.ok) throw new Error(answer.error ?? `HTTP ${response.status}`)
    return answer
  }

  // Who the token names, null without one or when the daemon does not answer.
  let me = null
  let meError = null
  async function loadMe() {
    if (!token()) {
      me = null
      meError = null
    } else {
      try {
        me = await api("/api/me")
        meError = null
      } catch (error) {
        me = null
        meError = error.message
      }
    }
    showWho()
  }

  function showWho() {
    const who = document.getElementById("who")
    if (me) {
      const forget = element("button", { type: "button", text: "sign out" })
      forget.addEventListener("click", () => {
        try {
          localStorage.removeItem(TOKEN_KEY)
        } catch {}
        loadMe().then(() => rerender())
      })
      who.replaceChildren(`Buttons act as ${me.user} · `, forget)
    } else if (meError) {
      who.replaceChildren(element("span", { className: "notice", text: meError }))
    } else {
      who.replaceChildren("Read-only: ", element("code", { text: "npm run wt -- login" }), " enables the buttons")
    }
  }

  // Actions in flight and the last error of each environment, kept across refreshes.
  const pending = new Set()
  const notices = new Map()
  let jobs = []

  async function act(key, slug, call) {
    pending.add(key)
    notices.delete(slug)
    rerender()
    try {
      await call()
    } catch (error) {
      notices.set(slug, error.message)
    } finally {
      pending.delete(key)
      refresh()
    }
  }

  function actionButton({ key, slug, label, call, className, confirmation }) {
    const button = element("button", { type: "button", text: pending.has(key) ? "…" : label })
    if (className) button.className = className
    button.disabled = pending.has(key)
    button.addEventListener("click", () => {
      if (confirmation && !confirm(confirmation)) return
      act(key, slug, call)
    })
    return button
  }

  // The output of a job or of logs, streamed as JSON lines until it ends or the dialog closes.
  let streaming = null
  async function showStream(title, path) {
    streaming?.abort()
    const controller = new AbortController()
    streaming = controller
    const dialog = document.getElementById("output")
    const text = document.getElementById("output-text")
    document.getElementById("output-title").textContent = title
    text.textContent = ""
    if (!dialog.open) dialog.showModal()
    const append = (value) => {
      const atBottom = text.scrollHeight - text.scrollTop - text.clientHeight < 40
      text.append(value)
      if (atBottom) text.scrollTop = text.scrollHeight
    }
    try {
      const response = await fetch(path, { headers: { "x-wt-token": token() ?? "" }, signal: controller.signal })
      if (!response.ok) throw new Error((await response.json()).error ?? `HTTP ${response.status}`)
      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader()
      let buffer = ""
      for (;;) {
        const { value, done } = await reader.read()
        if (done) break
        buffer += value
        const lines = buffer.split("\n")
        buffer = lines.pop()
        for (const line of lines.filter(Boolean)) {
          const event = JSON.parse(line)
          if (event.type === "output") append(event.text)
          else if (event.type === "exit") append(`\n${event.code === 0 ? "Finished." : `Failed (exit code ${event.code}).`}\n`)
        }
      }
    } catch (error) {
      if (error.name !== "AbortError") append(`\n${error.message}\n`)
    } finally {
      refresh()
    }
  }
  document.getElementById("output-close").addEventListener("click", () => document.getElementById("output").close())
  document.getElementById("output").addEventListener("close", () => streaming?.abort())

  async function startJob(path, body) {
    const { job } = await api(path, { method: "POST", body: body ?? {} })
    showStream(`${job.command}`, `/api/jobs/${job.id}`)
  }

  function showJob(job) {
    showStream(job.command, `/api/jobs/${job.id}`)
  }

  function service(entry) {
    return element("span", { title: entry.health }, [
      element("span", { className: `dot ${entry.health}` }),
      document.createTextNode(entry.name),
    ])
  }

  function pullRequest(pr) {
    if (!pr) return null
    return element("a", { href: pr.url, target: "_blank", rel: "noopener", title: pr.title ?? "", text: `PR #${pr.number} ${pr.state.toLowerCase()}` })
  }

  function issueLink(issue) {
    if (!issue) return null
    return element("a", { href: issue.url, target: "_blank", rel: "noopener", title: issue.title ?? "", text: `issue #${issue.number}` })
  }

  // The dashboard is read-only: it gives the command, and `wt new` checks the name in full.
  let routerPort = 8800

  function newWorktreeName(input) {
    const value = input.trim().toLowerCase()
    const issue = value.match(/^#?(\d+)$/u) ?? value.match(/\/issues\/(\d+)/u)
    return issue ? issue[1] : value
  }

  function newWorktreeCommand() {
    const name = newWorktreeName(document.getElementById("new-name").value)
    const description = document.getElementById("new-description").value.trim()
    // Single quotes keep the text as typed in the shell, a quote included.
    return description ? `npm run wt -- new ${name} --description '${description.replaceAll("'", "'\\''")}'` : `npm run wt -- new ${name}`
  }

  function showNewWorktree() {
    const name = newWorktreeName(document.getElementById("new-name").value)
    const valid = /^[a-z0-9]+(-[a-z0-9]+)*$/u.test(name) && name.length <= 32
    const output = document.getElementById("new-command")
    const button = document.getElementById("new-copy")
    button.disabled = !valid
    button.textContent = me ? "Create" : "New worktree"
    if (!name) output.replaceChildren()
    else if (!valid) output.replaceChildren("Lowercase letters, digits and single hyphens, at most 32 characters.")
    else {
      const url = `http://${name}.connect.localhost${routerPort === 80 ? "" : `:${routerPort}`}`
      output.replaceChildren(element("code", { text: newWorktreeCommand() }), ` gives ${url}`)
    }
  }

  document.getElementById("new-name").addEventListener("input", showNewWorktree)
  document.getElementById("new-description").addEventListener("input", showNewWorktree)
  document.getElementById("new-worktree").addEventListener("submit", async (event) => {
    event.preventDefault()
    const button = document.getElementById("new-copy")
    const name = newWorktreeName(document.getElementById("new-name").value)
    if (me) {
      try {
        const description = document.getElementById("new-description").value.trim()
        await startJob("/api/worktrees", { name, ...(description ? { description } : {}) })
        document.getElementById("new-name").value = ""
        document.getElementById("new-description").value = ""
        showNewWorktree()
      } catch (error) {
        document.getElementById("new-command").replaceChildren(element("span", { className: "notice", text: error.message }))
      }
      return
    }
    try {
      await navigator.clipboard.writeText(newWorktreeCommand())
      button.textContent = "Copied, run it in the main checkout"
    } catch {
      button.textContent = "Copy failed, select the command"
    }
  })

  // An overall state, with the state of each service in a popover.
  function statusBadge(state, services) {
    return element("div", { className: "status" }, [
      element("button", { type: "button", className: `pill ${state}`, text: STATE_LABELS[state] ?? state }),
      element("div", { className: "popover" }, [element("div", { className: "services" }, services)]),
    ])
  }

  // The app, with the other links in a menu (the app picker of the platform's onboarding).
  let openMenu = null
  // lucide's chevron-down, as on the app picker.
  const CHEVRON_DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'

  function openButton(environment) {
    const links = environment.links.map((entry) => link(entry.name, entry.url))
    if (environment.tracesUrl) links.push(link("Traces", environment.tracesUrl))
    const [first, ...others] = links
    if (!first) return null
    if (others.length === 0) return element("div", { className: "open" }, [first])
    const menu = element("div", { className: "menu", role: "menu", id: `menu-${environment.slug}` }, others)
    for (const item of others) {
      item.setAttribute("role", "menuitem")
      item.addEventListener("click", () => setMenu(null))
    }
    const toggle = element("button", { type: "button", "aria-label": "Other links", "aria-haspopup": "menu", "aria-controls": menu.id })
    toggle.innerHTML = CHEVRON_DOWN
    toggle.addEventListener("click", (event) => {
      event.stopPropagation()
      setMenu(openMenu === environment.slug ? null : environment.slug)
    })
    const group = element("div", { className: "open", "data-slug": environment.slug }, [first, toggle, menu])
    showMenu(group, openMenu === environment.slug)
    return group
  }

  function showMenu(group, open) {
    group.querySelector(".menu").hidden = !open
    group.querySelector("button").setAttribute("aria-expanded", String(open))
  }

  function setMenu(slug) {
    openMenu = slug
    for (const group of document.querySelectorAll(".open[data-slug]")) showMenu(group, group.dataset.slug === slug)
  }

  document.addEventListener("click", (event) => {
    if (openMenu && !event.target.closest(".menu")) setMenu(null)
  })
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && openMenu) setMenu(null)
  })

  // A read-only value to copy: clicking it selects all of it.
  function field(label, value, hint) {
    const id = `field-${crypto.randomUUID()}`
    const input = element("input", { id, value, readonly: "", title: value })
    input.addEventListener("focus", () => input.select())
    return element("div", { className: "field" }, [
      element("label", { for: id, text: label }),
      input,
      hint ? element("span", { text: hint }) : null,
    ])
  }

  // The dashboard is read-only: it gives the command, and the cleanup checks it is safe.
  function cleanupHint(cleanup) {
    if (cleanup?.verdict === "remove") return `Safe to remove (${cleanup.reason}). Run it in the main checkout.`
    if (cleanup) return `Kept for now: ${cleanup.reason}.`
    return "Run it in the main checkout once the pull request is merged."
  }

  function separated(nodes) {
    return nodes.filter(Boolean).flatMap((node, index) => (index === 0 ? [node] : [document.createTextNode(" · "), node]))
  }

  function isMine(environment) {
    return Boolean(me) && environment.ownerUid === me.uid
  }

  const RUNNING = new Set(["healthy", "running", "starting", "unhealthy"])
  const ONE_SHOT_SERVICES = new Set(["init", "db", "migrate"])

  function serviceRow(environment, entry) {
    const slug = environment.slug
    const compose = (action) => () => api(`/api/environments/${slug}/${action}`, { method: "POST", body: { service: entry.name } })
    const key = (action) => `${slug}/${entry.name}/${action}`
    const buttons = []
    const running = RUNNING.has(entry.health)
    if (ONE_SHOT_SERVICES.has(entry.name)) {
      if (!running) buttons.push(actionButton({ key: key("start"), slug, label: "Run", call: compose("start") }))
    } else if (running) {
      buttons.push(actionButton({ key: key("restart"), slug, label: "Restart", call: compose("restart") }))
      buttons.push(actionButton({ key: key("stop"), slug, label: "Stop", call: compose("stop") }))
    } else {
      buttons.push(actionButton({ key: key("start"), slug, label: "Start", call: compose("start") }))
    }
    const logs = element("button", { type: "button", text: "Logs" })
    logs.addEventListener("click", () => showStream(`${slug} · ${entry.name}`, `/api/environments/${slug}/logs?service=${entry.name}&follow=1`))
    return element("div", { className: "service-row" }, [
      element("span", { className: `dot ${entry.health}` }),
      element("span", { className: "name", text: entry.name }),
      element("span", { className: "health", text: entry.health }),
      logs,
      ...buttons,
    ])
  }

  // What the owner of an environment can do from here, through their daemon.
  const openServices = new Set()
  function ownerControls(environment) {
    const slug = environment.slug
    const stopped = environment.state === "stopped"
    const run = (action) => () => startJob(`/api/environments/${slug}/${action}`)
    const compose = (action) => () => api(`/api/environments/${slug}/${action}`, { method: "POST", body: {} })
    const open = (target) => () => api(`/api/environments/${slug}/open`, { method: "POST", body: { target } })
    const job = jobs.find((entry) => entry.slug === slug && entry.exitCode === null)
    const actions = [
      actionButton({ key: `${slug}/env`, slug, label: stopped ? "Start" : "Stop", className: stopped ? "primary" : null, call: compose(stopped ? "start" : "stop") }),
      actionButton({ key: `${slug}/up`, slug, label: "Update (wt up)", call: run("up") }),
    ]
    const logs = element("button", { type: "button", text: "Logs" })
    logs.addEventListener("click", () => showStream(`${slug} · all services`, `/api/environments/${slug}/logs?follow=1`))
    actions.push(logs)
    if (me.platform === "darwin" && environment.path) {
      actions.push(actionButton({ key: `${slug}/editor`, slug, label: "Editor", call: open("editor") }))
      actions.push(actionButton({ key: `${slug}/terminal`, slug, label: "Terminal", call: open("terminal") }))
    }
    actions.push(
      actionButton({ key: `${slug}/reset-db`, slug, label: "Reset databases", className: "danger", call: run("reset-db"), confirmation: `Replace the databases of ${slug} with a fresh copy of the main checkout's? A dump of the current ones is kept 14 days.` }),
      actionButton({ key: `${slug}/down`, slug, label: "Remove environment", className: "danger", call: run("down"), confirmation: `Remove the environment of ${slug}: containers, volumes and databases? The worktree stays, and a dump is kept 14 days.` }),
      actionButton({ key: `${slug}/cleanup`, slug, label: "Close worktree", className: "danger", call: run("cleanup"), confirmation: `Close ${slug}: its environment, databases, worktree and branch go, if nothing would be lost (${cleanupHint(environment.cleanup)})` }),
    )
    const services = element("details", { className: "owned" }, [
      element("summary", { text: "Services" }),
      element("div", { className: "service-rows" }, environment.services.map((entry) => serviceRow(environment, entry))),
    ])
    services.open = openServices.has(slug)
    services.addEventListener("toggle", () => (services.open ? openServices.add(slug) : openServices.delete(slug)))
    let running = null
    if (job) {
      const view = element("button", { type: "button", className: "link-button", text: "see its output" })
      view.addEventListener("click", () => showJob(job))
      running = element("div", { className: "running" }, [`${job.command} is running · `, view])
    }
    const notice = notices.get(slug)
    return [
      running,
      element("div", { className: "actions" }, actions),
      notice ? element("div", { className: "notice", text: notice }) : null,
      // The last verdict of the cleanup, which runs at each session start.
      environment.cleanup
        ? element("div", {
            className: "meta",
            text: environment.cleanup.verdict === "keep" ? `Close worktree: kept for now, ${environment.cleanup.reason}.` : `Close worktree: safe (${environment.cleanup.reason}).`,
          })
        : null,
      services,
    ]
  }

  // What the worktree is for. Its owner changes it here, as `wt describe` does in the worktree.
  function description(environment, mine) {
    const edit = () => {
      const text = prompt(`What is ${environment.slug} for?`, environment.description ?? "")
      if (text === null || !text.trim()) return
      act(`${environment.slug}/describe`, environment.slug, () =>
        api(`/api/environments/${environment.slug}/describe`, { method: "POST", body: { description: text.trim() } }),
      )
    }
    const editButton = mine
      ? element("button", { type: "button", className: "link-button", text: environment.description ? "edit" : "Describe it" })
      : null
    editButton?.addEventListener("click", edit)
    if (environment.description) {
      return element("p", { className: "description", title: environment.description }, [
        environment.description,
        editButton ? " · " : null,
        editButton,
      ])
    }
    return element("p", { className: "description missing" }, mine
      ? ["No description. ", editButton]
      : ["No description: ", element("code", { text: 'npm run wt -- describe "…"' }), " in the worktree."])
  }

  function environmentCard(environment) {
    const mine = isMine(environment)
    const details = []
    if (environment.databases) details.push(field("Databases", Object.values(environment.databases).join(", ")))
    if (environment.path) details.push(field("Path", environment.path))
    if (!mine) details.push(field("Close and cleanup worktree", environment.cleanupCommand, cleanupHint(environment.cleanup)))
    return element("article", { className: "card" }, [
      element("div", { className: "title" }, [
        element("strong", { text: environment.slug }),
        statusBadge(environment.state, environment.services.map(service)),
      ]),
      description(environment, mine),
      environment.owner && !mine ? element("div", { className: "meta", text: `Owned by ${environment.owner}` }) : null,
      environment.branch || environment.issue || environment.pr
        ? element("div", { className: "branch" }, separated([
            environment.branch ? document.createTextNode(environment.branch) : null,
            issueLink(environment.issue),
            pullRequest(environment.pr),
          ]))
        : null,
      openButton(environment),
      ...(mine ? ownerControls(environment) : []),
      details.length ? element("div", { className: "details" }, details) : null,
    ])
  }

  // A card is rebuilt only when its environment changed, so a refresh keeps an open menu, the
  // popover under the mouse and a selection in a field.
  let cards = new Map()
  let sharedData = null

  function card(environment) {
    // What else the card shows: the caller, and their actions, notices and jobs on it.
    const slug = environment.slug
    const data = JSON.stringify([
      environment,
      me?.uid,
      [...pending].filter((key) => key.startsWith(`${slug}/`)),
      notices.get(slug),
      jobs.filter((job) => job.slug === slug && job.exitCode === null).map((job) => job.id),
    ])
    const known = cards.get(environment.slug)
    return known?.data === data ? known : { data, node: environmentCard(environment) }
  }

  let lastState = null
  function rerender() {
    if (lastState) render(lastState)
  }

  function render(state) {
    lastState = state
    const environments = document.getElementById("environments")
    cards = new Map(state.environments.map((environment) => [environment.slug, card(environment)]))
    const nodes = state.environments.length
      ? [...cards.values()].map((entry) => entry.node)
      : [element("p", { className: "empty", text: "No environment yet. Create one above, or from Claude Code with /worktree-env <name>." })]
    // Moving a node, even to the same place, would drop its focus and selection.
    const current = [...environments.children]
    if (nodes.length !== current.length || nodes.some((node, index) => node !== current[index])) {
      environments.replaceChildren(...nodes)
    }
    const shared = JSON.stringify([state.sharedState, state.shared])
    if (shared !== sharedData) {
      sharedData = shared
      document.getElementById("shared").replaceChildren(
        statusBadge(
          state.sharedState,
          state.shared.map((entry) =>
            entry.url
              ? element("span", { title: entry.health }, [element("span", { className: `dot ${entry.health}` }), link(entry.name, entry.url)])
              : service(entry),
          ),
        ),
      )
    }
    if (state.routerPort !== routerPort) {
      routerPort = state.routerPort
      showNewWorktree()
    }
    document.getElementById("updated").textContent = `Updated ${new Date(state.generatedAt).toLocaleTimeString()}`
    document.getElementById("error").replaceChildren()
  }

  async function refresh() {
    try {
      const response = await fetch("/api/state", { cache: "no-store" })
      if (!response.ok) throw new Error(`HTTP ${response.status}`)
      const state = await response.json()
      if (me) jobs = (await api("/api/jobs").catch(() => ({ jobs }))).jobs
      render(state)
    } catch (error) {
      document.getElementById("error").replaceChildren(
        element("p", { className: "error", text: `Could not load the environments (${error.message}). Retrying.` }),
      )
    }
  }

  loadMe().then(async () => {
    showNewWorktree()
    await refresh()
    const job = jobs.find((entry) => entry.id === fragmentJob)
    if (job) showJob(job)
  })
  setInterval(refresh, 3000)
</script>
</body>
</html>
