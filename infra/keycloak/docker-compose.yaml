# Local OpenID Connect provider for development. Not for production use.
# docker compose -f infra/keycloak/docker-compose.yaml up -d
# Admin console: http://localhost:8080 (admin / admin)
# Imports realm-platform.local.json when it exists (git-ignored), else realm-platform.sample.json.
name: "connect-keycloak"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    entrypoint: ["sh", "-c"]
    command:
      - |
        realm=/srv/keycloak/realm-platform.local.json
        [ -f "$$realm" ] || realm=/srv/keycloak/realm-platform.sample.json
        echo "Keycloak realm: $$realm"
        mkdir -p /opt/keycloak/data/import
        cp "$$realm" /opt/keycloak/data/import/realm-platform.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      # The folder, not a file: a missing file would be mounted as an empty folder.
      - .:/srv/keycloak:ro
