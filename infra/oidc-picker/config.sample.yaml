# oidc-picker configuration for local development. Not for production use: anyone who reaches it
# signs in as any profile below, without a password. Same client and people as
# infra/keycloak/realm-platform.sample.json.
issuer: http://localhost:5556

clients:
  # Public client of the web app and the Desk (authorization code + PKCE). The web app redirects
  # to its origin, plus VITE_BASE_PATH when set. The Desk (dev server on 5177) comes back to
  # /app/auth/callback after sign-in and to /app/ after sign-out.
  - id: platform-web
    redirectUris:
      - https://connect.localhost:5173
      - https://connect.localhost:5174
      - http://localhost:5173
      - https://connect.localhost:3000
      - https://connect.localhost:5177/app/auth/callback
      - https://connect.localhost:5177/app/
      - http://localhost:5177/app/auth/callback
      - http://localhost:5177/app/

# The picker reports every email as verified, so people added by email are linked.
profiles:
  - sub: 5f0c7a0e-1d1e-4b8a-9c41-0a6f1f0d0001
    email: admin@example.org
    name: admin
  - sub: 5f0c7a0e-1d1e-4b8a-9c41-0a6f1f0d0002
    email: member@example.org
    name: member
