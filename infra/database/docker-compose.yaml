# Local dev stack, one compose project for everything (`connect-db`).
# A plain `docker compose up -d` (and the CI) starts pgvector and redis only.
# Profiles: `mail` (Mailpit), `keycloak`, `dex`, `traces` (otel-collector,
# Phoenix), `analytics` (Grafana), `router` (Traefik and the dashboard of the
# worktree environments), `bull-board`. See the README for the commands.
#
# Mounts of files and folders that must exist use the long syntax with
# `create_host_path: false`: a missing source then fails `docker compose up`
# with "bind source path does not exist". With the short syntax Docker creates
# the missing path as an empty root-owned folder, which the container reads as
# a broken file and which breaks the next checkout on the CI runners.
# Only the data folders under ./dontsave are created on first start.
#
# The services the main checkout and the worktree environments rely on restart
# with Docker (`restart: unless-stopped`): after a reboot, the ones that were
# running come back, until you stop them with `docker compose stop`. Keycloak
# and Grafana, started on demand, do not.
name: "connect-db"
services:
  pgvector:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Parallel queries use /dev/shm; Docker's default 64 MB is too small.
    shm_size: 256mb
    # log_statement=all is verbose: the local driver rotates the files.
    logging:
      driver: local
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: passpass
    volumes:
      - type: bind
        source: ./sql/common.sql
        target: /docker-entrypoint-initdb.d/common.sql
        read_only: true
        bind:
          create_host_path: false
      - ./dontsave/pgdata:/var/lib/postgresql/data
    # 500 connections: the main checkout, each worktree environment (an API
    # and workers hold about 26) and parallel test runs share this server.
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "max_connections=500"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
  # Grafana on the analytics schema: http://localhost:3300, no login.
  # Datasource provisioned from ./grafana, dashboards from the Helm chart
  # (deploy/helm/bayes-platform/dashboards), the same files the cluster gets.
  # Profile `analytics`: a plain `docker compose up` (and the CI, make db-tests)
  # leaves it off; `docker compose up -d grafana` names it, so starts it.
  # ANALYTICS_DB_NAME is the database the datasource reads (GRAFANA_DATABASE in
  # infra/database/.env, `connect` by default).
  grafana:
    image: grafana/grafana:13.2.2 # same major as the cluster (chart grafana 13.x)
    profiles: [analytics]
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    environment:
      ANALYTICS_DB_NAME: ${GRAFANA_DATABASE:-connect}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/helm/bayes-platform/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - pgvector
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${DEV_DOMAIN:-connect.localhost}`) || Host(`grafana.connect.localhost`)
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
  # LLM traces: the API sends OTLP to the collector (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318),
  # which maps them to OpenInference and forwards them to Phoenix at http://localhost:6060
  # (6006 belongs to the web app's Storybook and its MCP server in .mcp.json).
  # Profile `traces`: a plain `docker compose up` (and the CI, make db-tests)
  # leaves them off; start them with `docker compose --profile traces up -d`.
  otel-collector:
    image: otel/opentelemetry-collector-k8s:0.161.0 # same distribution as the gateway of the clusters
    profiles: [traces]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    ports:
      - "${OTEL_COLLECTOR_PORT:-4318}:4318"
    environment:
      PHOENIX_ENDPOINT: http://phoenix:6006
    volumes:
      # The chart's file: one copy of the mapping (deploy/helm/bayes-platform/files).
      - type: bind
        source: ../../deploy/helm/bayes-platform/files/otel-collector.yaml
        target: /etc/otelcol/collector.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - phoenix
  phoenix:
    image: arizephoenix/phoenix:version-20.14.0 # same version as staging (chart phoenix-helm 12.0.x)
    profiles: [traces]
    restart: unless-stopped
    ports:
      - "${PHOENIX_PORT:-6060}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - ./dontsave/phoenix:/mnt/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.phoenix.rule: Host(`phoenix.${DEV_DOMAIN:-connect.localhost}`) || Host(`phoenix.connect.localhost`)
      traefik.http.services.phoenix.loadbalancer.server.port: "6006"
  # Fake SMTP server for the invitation emails: catches every email, sends
  # none, and shows them at http://localhost:8025. Set SMTP_HOST=localhost and
  # SMTP_PORT=1025 in apps/api/.env to use it.
  # Profile `mail`: start it with `docker compose --profile mail up -d`.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: [mail]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      # Accept any SMTP credentials, so an .env with SMTP_USER set still works.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    labels:
      traefik.enable: "true"
      traefik.http.routers.mail.rule: Host(`mail.${DEV_DOMAIN:-connect.localhost}`) || Host(`mail.connect.localhost`)
      traefik.http.services.mail.loadbalancer.server.port: "8025"
  # Local OpenID Connect provider, http://localhost:8080 (admin / admin). Not for
  # production use. Imports infra/keycloak/realm-platform.local.json when it
  # exists (git-ignored), else realm-platform.sample.json. See infra/keycloak/README.md.
  # Profile `keycloak`: `docker compose --profile keycloak up -d --no-recreate keycloak`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    profiles: [keycloak]
    entrypoint: ["sh", "-c"]
    command:
      - |
        realm=/srv/keycloak/realm-platform.local.json
        [ -f "$$realm" ] || realm=/srv/keycloak/realm-platform.sample.json
        echo "Keycloak realm: $$realm"
        mkdir -p /opt/keycloak/data/import
        cp "$$realm" /opt/keycloak/data/import/realm-platform.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      # The folder, so the local realm copy is optional.
      - type: bind
        source: ../keycloak
        target: /srv/keycloak
        read_only: true
        bind:
          create_host_path: false
  # Lighter local OpenID Connect provider, http://localhost:5556. Not for
  # production use. Reads infra/dex/config.local.yaml when it exists
  # (git-ignored), else config.sample.yaml. See infra/dex/README.md.
  # Profile `dex`: `docker compose --profile dex up -d --no-recreate dex`.
  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    profiles: [dex]
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        config=/srv/dex/config.local.yaml
        [ -f "$$config" ] || config=/srv/dex/config.sample.yaml
        echo "Dex configuration: $$config"
        exec dex serve "$$config"
    ports:
      # Fixed: the port is part of the issuer in the configuration.
      - "5556:5556"
    volumes:
      # The folder, so the local config copy is optional.
      - type: bind
        source: ../dex
        target: /srv/dex
        read_only: true
        bind:
          create_host_path: false
  # Router of the worktree environments, from Docker labels (only the containers
  # labeled traefik.enable=true):
  # - http://<name>.connect.localhost on 127.0.0.1:${ROUTER_PORT:-8800}, the
  #   default. Browsers resolve *.localhost and treat it as a secure context.
  # - https on 127.0.0.1:${HTTPS_PORT:-8443} with the certificate of DEV_CERT_DIR,
  #   for DEV_DOMAIN: a domain of yours whose names resolve to 127.0.0.1. See
  #   "HTTPS on a domain of your own" in infra/worktree/README.md. The entrypoint
  #   listens on the same port inside the container, so the environments'
  #   containers reach their Dex at its public URL through Traefik. Plain http to
  #   DEV_DOMAIN redirects to https.
  # The file provider watches DEV_CERT_DIR: a renewed certificate is served as
  # soon as its files change there. Traefik's own dashboard is at
  # /dashboard/ on traefik.<domain>. The 0s read timeouts keep long uploads and
  # streams open.
  # Profile `router`: `docker compose --profile router up -d --no-recreate`.
  traefik:
    image: traefik:v3.7.14
    profiles: [router]
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:${ROUTER_PORT:-8800}
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=0s
      - --entrypoints.websecure.address=:${HTTPS_PORT:-8443}
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0s
      # Every router of this entrypoint is served over TLS, with the default certificate.
      - --entrypoints.websecure.http.tls=true
      - --providers.file.directory=/certs
      - --providers.file.watch=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=connect-db_default
      # A starting or unhealthy service answers 503 instead of falling through to another router.
      - --providers.docker.allowEmptyServices=true
      - --api.dashboard=true
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=WARN
    ports:
      - "127.0.0.1:${ROUTER_PORT:-8800}:${ROUTER_PORT:-8800}"
      - "127.0.0.1:${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      # The certificate, its key and traefik.yml, which names them. Empty by default: the https
      # entrypoint then serves Traefik's own certificate, and nothing uses it.
      - type: bind
        source: ${DEV_CERT_DIR:-./dev-certs}
        target: /certs
        read_only: true
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`traefik.${DEV_DOMAIN:-connect.localhost}`) || Host(`traefik.connect.localhost`)
      traefik.http.routers.traefik.service: api@internal
      # Plain http to DEV_DOMAIN goes to https, ahead of every other router.
      traefik.http.routers.to-https.rule: HostRegexp(`^.+\.${DEV_DOMAIN:-https-disabled.invalid}$$`)
      traefik.http.routers.to-https.entrypoints: web
      traefik.http.routers.to-https.priority: "100000"
      traefik.http.routers.to-https.middlewares: to-https
      traefik.http.routers.to-https.service: noop@internal
      traefik.http.middlewares.to-https.redirectscheme.scheme: https
      traefik.http.middlewares.to-https.redirectscheme.port: "${HTTPS_PORT:-8443}"
  # Queue dashboard on the local Redis, http://localhost:3400 (and
  # http://bull-board.connect.localhost:8800 with the router), no login.
  # See infra/bull-board/README.md.
  # Profile `bull-board`: `docker compose --profile bull-board up -d --no-recreate bull-board`.
  bull-board:
    image: venatum/bull-board:3.4.14
    profiles: [bull-board]
    depends_on: [redis]
    ports:
      - "${BULL_BOARD_PORT:-3400}:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    labels:
      traefik.enable: "true"
      traefik.http.routers.bull-board.rule: Host(`bull-board.${DEV_DOMAIN:-connect.localhost}`) || Host(`bull-board.connect.localhost`)
      traefik.http.services.bull-board.loadbalancer.server.port: "3000"
