# Local dev stack, one compose project for everything (`connect-db`).
# A plain `docker compose up -d` (and the CI) starts pgvector and redis only.
# Profiles: `mail` (Mailpit), `keycloak`, `dex`, `traces` (otel-collector,
# Phoenix), `analytics` (Grafana), `router` (Traefik and the dashboard of the
# worktree environments). See the README for the commands.
#
# Mounts of files and folders that must exist use the long syntax with
# `create_host_path: false`: a missing source then fails `docker compose up`
# with "bind source path does not exist". With the short syntax Docker creates
# the missing path as an empty root-owned folder, which the container reads as
# a broken file and which breaks the next checkout on the CI runners.
# Only the data folders under ./dontsave are created on first start.
name: "connect-db"
services:
  pgvector:
    image: pgvector/pgvector:pg17
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: passpass
    volumes:
      - type: bind
        source: ./sql/common.sql
        target: /docker-entrypoint-initdb.d/common.sql
        read_only: true
        bind:
          create_host_path: false
      - ./dontsave/pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
  # Grafana on the analytics schema: http://localhost:3300, no login.
  # Datasource provisioned from ./grafana, dashboards from the Helm chart
  # (deploy/helm/bayes-platform/dashboards), the same files the cluster gets.
  # Profile `analytics`: a plain `docker compose up` (and the CI, make db-tests)
  # leaves it off; `docker compose up -d grafana` names it, so starts it.
  grafana:
    image: grafana/grafana:13.2.2 # same major as the cluster (chart grafana 13.x)
    profiles: [analytics]
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/helm/bayes-platform/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - pgvector
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.connect.localhost`)
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
  # LLM traces: the API sends OTLP to the collector (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318),
  # which maps them to OpenInference and forwards them to Phoenix at http://localhost:6006.
  # Profile `traces`: a plain `docker compose up` (and the CI, make db-tests)
  # leaves them off; start them with `docker compose --profile traces up -d`.
  otel-collector:
    image: otel/opentelemetry-collector-k8s:0.161.0 # same distribution as the gateway of the clusters
    profiles: [traces]
    command: ["--config=/etc/otelcol/collector.yaml"]
    ports:
      - "${OTEL_COLLECTOR_PORT:-4318}:4318"
    environment:
      PHOENIX_ENDPOINT: http://phoenix:6006
    volumes:
      # The chart's file: one copy of the mapping (deploy/helm/bayes-platform/files).
      - type: bind
        source: ../../deploy/helm/bayes-platform/files/otel-collector.yaml
        target: /etc/otelcol/collector.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - phoenix
  phoenix:
    image: arizephoenix/phoenix:version-20.14.0 # same version as staging (chart phoenix-helm 12.0.x)
    profiles: [traces]
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - ./dontsave/phoenix:/mnt/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.phoenix.rule: Host(`phoenix.connect.localhost`)
      traefik.http.services.phoenix.loadbalancer.server.port: "6006"
  # Fake SMTP server for the invitation emails: catches every email, sends
  # none, and shows them at http://localhost:8025. Set SMTP_HOST=localhost and
  # SMTP_PORT=1025 in apps/api/.env to use it.
  # Profile `mail`: start it with `docker compose --profile mail up -d`.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: [mail]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      # Accept any SMTP credentials, so an .env with SMTP_USER set still works.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    labels:
      traefik.enable: "true"
      traefik.http.routers.mail.rule: Host(`mail.connect.localhost`)
      traefik.http.services.mail.loadbalancer.server.port: "8025"
  # Local OpenID Connect provider, http://localhost:8080 (admin / admin). Not for
  # production use. Imports infra/keycloak/realm-platform.local.json when it
  # exists (git-ignored), else realm-platform.sample.json. See infra/keycloak/README.md.
  # Profile `keycloak`: `docker compose --profile keycloak up -d --no-recreate keycloak`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    profiles: [keycloak]
    entrypoint: ["sh", "-c"]
    command:
      - |
        realm=/srv/keycloak/realm-platform.local.json
        [ -f "$$realm" ] || realm=/srv/keycloak/realm-platform.sample.json
        echo "Keycloak realm: $$realm"
        mkdir -p /opt/keycloak/data/import
        cp "$$realm" /opt/keycloak/data/import/realm-platform.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      # The folder, so the local realm copy is optional.
      - type: bind
        source: ../keycloak
        target: /srv/keycloak
        read_only: true
        bind:
          create_host_path: false
  # Lighter local OpenID Connect provider, http://localhost:5556. Not for
  # production use. Reads infra/dex/config.local.yaml when it exists
  # (git-ignored), else config.sample.yaml. See infra/dex/README.md.
  # Profile `dex`: `docker compose --profile dex up -d --no-recreate dex`.
  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    profiles: [dex]
    entrypoint: ["sh", "-c"]
    command:
      - |
        config=/srv/dex/config.local.yaml
        [ -f "$$config" ] || config=/srv/dex/config.sample.yaml
        echo "Dex configuration: $$config"
        exec dex serve "$$config"
    ports:
      # Fixed: the port is part of the issuer in the configuration.
      - "5556:5556"
    volumes:
      # The folder, so the local config copy is optional.
      - type: bind
        source: ../dex
        target: /srv/dex
        read_only: true
        bind:
          create_host_path: false
  # Router of the worktree environments: every host *.connect.localhost on
  # http://127.0.0.1:${ROUTER_PORT:-8800}, routed by Docker labels (only the
  # containers labeled traefik.enable=true). Plain HTTP: browsers treat
  # *.localhost as a secure context. Traefik's own dashboard is at
  # http://traefik.connect.localhost:8800/dashboard/. The 0s read timeout
  # keeps long uploads and streams open.
  # Profile `router`: `docker compose --profile router up -d --no-recreate`.
  traefik:
    image: traefik:v3.7.14
    profiles: [router]
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:${ROUTER_PORT:-8800}
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=0s
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=connect-db_default
      # A starting or unhealthy service answers 503 instead of falling through to another router.
      - --providers.docker.allowEmptyServices=true
      - --api.dashboard=true
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=WARN
    ports:
      - "127.0.0.1:${ROUTER_PORT:-8800}:${ROUTER_PORT:-8800}"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`traefik.connect.localhost`)
      traefik.http.routers.traefik.service: api@internal
  # The list of worktree environments with their links: http://dev.connect.localhost:8800.
  # It also answers every host no running service takes (a page that says what
  # is starting or what to start), and the 502-504 errors of the environments
  # through the dev-starting middleware. Read-only access to Docker. It reads
  # status.json (branch, pull request, databases) from ~/.bayes-worktrees, which
  # the worktree tooling writes.
  dev-dashboard:
    image: node:24.21.0-trixie-slim
    profiles: [router]
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    environment:
      ROUTER_PORT: ${ROUTER_PORT:-8800}
      STATE_DIR: /state
    volumes:
      - type: bind
        source: ../dev-dashboard
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ${DEV_STATE_DIR:-${HOME}/.bayes-worktrees}
        target: /state
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((reply) => process.exit(reply.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
    labels:
      traefik.enable: "true"
      traefik.http.routers.dev-dashboard.rule: Host(`dev.connect.localhost`)
      traefik.http.routers.dev-dashboard.service: dev-dashboard
      traefik.http.routers.dev-fallback.rule: HostRegexp(`^.+\.connect\.localhost$$`)
      traefik.http.routers.dev-fallback.priority: "1"
      traefik.http.routers.dev-fallback.service: dev-dashboard
      traefik.http.services.dev-dashboard.loadbalancer.server.port: "8080"
      traefik.http.middlewares.dev-starting.errors.status: "502-504"
      traefik.http.middlewares.dev-starting.errors.service: dev-dashboard
      traefik.http.middlewares.dev-starting.errors.query: /status?code={status}
