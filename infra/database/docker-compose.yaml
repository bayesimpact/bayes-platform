name: "connect-db"
services:
  pgvector:
    image: pgvector/pgvector:pg17
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: passpass
    volumes:
      - ./sql/common.sql:/docker-entrypoint-initdb.d/common.sql
      - ./dontsave/pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
  # Grafana on the analytics schema: http://localhost:3300, no login.
  # Datasource provisioned from ./grafana, dashboards from the Helm chart
  # (deploy/helm/bayes-platform/dashboards), the same files the cluster gets.
  grafana:
    image: grafana/grafana:13.2.2 # same major as the cluster (chart grafana 13.x)
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/helm/bayes-platform/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - pgvector
