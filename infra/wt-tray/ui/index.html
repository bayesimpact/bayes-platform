<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worktrees</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --border: #e1e4e8;
    --accent: #2f6fde;
    --ready: #1f9d55;
    --starting: #d69e2e;
    --problem: #d64545;
    --stopped: #9aa5b1;
    --hover: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b;
      --card: #1b2128;
      --text: #e4e7eb;
      --muted: #9aa5b1;
      --border: #2c343d;
      --accent: #6ea8fe;
      --hover: #262d36;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 13px/1.45 system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--border); }
  h1 { font-size: 0.95rem; margin: 0; }
  .header-side { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; }
  main { flex: 1; overflow-y: auto; padding: 0.6rem; display: grid; align-content: start; gap: 0.6rem; }
  footer { padding: 0.35rem 0.85rem; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.7rem; display: grid; gap: 0.45rem; }
  .row { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .slug { font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
  .description { font-size: 0.78rem; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .branch { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 0.75rem; }
  .links { display: flex; flex-wrap: wrap; gap: 0.3rem 0.7rem; font-size: 0.78rem; }
  .pill { font-size: 0.7rem; font-weight: 600; padding: 0.05rem 0.5rem; border-radius: 999px; color: #fff; white-space: nowrap; }
  .pill.ready { background: var(--ready); }
  .pill.starting { background: var(--starting); }
  .pill.problem { background: var(--problem); }
  .pill.stopped { background: var(--stopped); }
  .dot { flex: none; display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; }
  .dot.healthy, .dot.running, .dot.done, .dot.ready { background: var(--ready); }
  .dot.starting { background: var(--starting); }
  .dot.unhealthy, .dot.failed, .dot.dead, .dot.problem { background: var(--problem); }
  .dot.stopped, .dot.unknown, .dot.paused, .dot.exited { background: var(--stopped); }
  button { font: inherit; font-size: 0.75rem; font-weight: 500; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 0.1rem 0.55rem; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  details summary { cursor: pointer; font-size: 0.78rem; color: var(--muted); list-style-position: inside; }
  .services { display: grid; gap: 0.15rem; margin-top: 0.35rem; }
  .service { display: flex; align-items: center; gap: 0.5rem; padding: 0.15rem 0.3rem; border-radius: 4px; font-size: 0.8rem; }
  .service:hover { background: var(--hover); }
  .service .health { color: var(--muted); font-size: 0.72rem; }
  .banner { padding: 0.6rem 0.7rem; border-radius: 8px; border: 1px solid var(--problem); color: var(--problem); background: var(--card); }
  .empty { padding: 2rem 1rem; text-align: center; color: var(--muted); }
  .tools { flex-wrap: wrap; gap: 0.35rem; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 0.8rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 0.2rem 0.45rem; }
  code { font-family: ui-monospace, monospace; font-size: 0.75rem; background: var(--hover); padding: 0.05rem 0.25rem; border-radius: 3px; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<header>
  <h1>Worktree environments</h1>
  <div class="header-side">
    <span id="who"></span>
    <a id="dashboard">Dashboard</a>
  </div>
</header>
<main id="environments"></main>
<footer id="updated">Waiting for the dashboard…</footer>
<script type="module" src="app.js"></script>
</body>
</html>
