name: Branch Workers Smoke

on:
  push:
    branches-ignore:
      - main
    paths:
      - "apps/api/**"
      - "infra/**"
      - "Makefile"
  workflow_dispatch:

jobs:
  workers-smoke:
    # Self-hosted: the Docker daemon of the runner keeps the build cache
    # between runs, so only the layers that depend on the branch are rebuilt
    # (the Torch install alone is two minutes on a GitHub runner). Push events
    # fire for branches of this repository only, never for forks.
    runs-on: self-hosted
    # One smoke at a time on the runner: the compose stack binds fixed ports
    # and uses one compose project, api-workers-smoke.
    concurrency:
      group: workers-smoke-self-hosted
      cancel-in-progress: false
    steps:
      # Only the api-workers-smoke project of a smoke run that stopped before
      # its own cleanup. The tests of the other runner instance can run at
      # this time.
      - name: Clean up Docker artifacts of a previous smoke run
        run: |
          docker ps -aq --filter label=com.docker.compose.project=api-workers-smoke | xargs -r docker rm -f -v

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run workers startup smoke check
        run: make docker-workers-check

      - name: Stop the smoke stack
        if: always()
        run: make docker-smoke-down

      # The GPU workers image alone is 15 GB, and the build cache already keeps
      # its layers for the next run. Dangling images are the previous builds
      # whose tag moved to a newer one.
      - name: Remove the smoke images
        if: always()
        run: |
          docker image rm -f caseai-connect/gpu-workers:local caseai-connect/cpu-workers:local || true
          docker image prune -f
