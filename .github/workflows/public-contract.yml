name: Public contract

# Gate on the public chat API contract (docs/public-api-contract.md). Runs on label
# events too, so a maintainer's label turns the check green without a new push.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  # The label check reads the PR timeline through the issues endpoint.
  issues: read
  pull-requests: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Check the public API contract gate
        # Fetch the base tip, then diff the PR head against its merge base.
        # github.sha is a merge into the latest base, and pull_request.base.sha
        # can stay at the commit from when the PR opened. Diffing those two
        # lists files that already landed on the base.
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node .github/scripts/public-contract-check.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
