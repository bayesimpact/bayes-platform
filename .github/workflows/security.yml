name: Security

on:
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy:
    name: trivy
    runs-on:
      labels: ubuntu-latest-m
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build images
        run: make docker-build

      - name: Build PDF Converter image
        run: make docker-build-pdf-converter

      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/api:local'
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-api-results.json'

      - name: Run Trivy vulnerability scanner on CPU Workers
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/cpu-workers:local'
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-cpu-workers-results.json'

      - name: Run Trivy vulnerability scanner on GPU Workers
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/gpu-workers:local'
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-gpu-workers-results.json'

      - name: Run Trivy vulnerability scanner on PDF Converter
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/pdf-converter:local'
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-pdf-converter-results.json'

      - name: Trivy scan summary
        if: always()
        run: |
          .github/scripts/trivy-report.sh "$GITHUB_STEP_SUMMARY" \
            "API image=trivy-api-results.json" \
            "CPU workers image=trivy-cpu-workers-results.json" \
            "GPU workers image=trivy-gpu-workers-results.json" \
            "PDF converter image=trivy-pdf-converter-results.json"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*-results.json
          if-no-files-found: ignore
