name: Security

on:
  pull_request:
    branches:
      - main

# A newer push to the same pull request supersedes the scan of the older one.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy:
    name: trivy
    # A standard runner: free on a public repository, where the 8-core one is billed. The GPU
    # workers image is close to 10 GB uncompressed, so the job frees the preinstalled toolchains
    # first, as publish-images.yml does for the same image.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Build images
        run: make docker-build

      - name: Build PDF Converter image
        run: make docker-build-pdf-converter

      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/api:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-api-results.txt'

      - name: Run Trivy vulnerability scanner on CPU Workers
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/cpu-workers:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-cpu-workers-results.txt'

      - name: Run Trivy vulnerability scanner on GPU Workers
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/gpu-workers:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-gpu-workers-results.txt'

      - name: Run Trivy vulnerability scanner on PDF Converter
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caseai-connect/pdf-converter:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          output: 'trivy-pdf-converter-results.txt'

      - name: Trivy scan summary
        if: always()
        run: |
          MAX_SIZE=300000
          print_report() {
            local label="$1" file="$2"
            echo "### $label"
            echo '```'
            if [ ! -f "$file" ]; then
              echo "(scan did not run)"
            elif [ "$(wc -c < "$file")" -gt "$MAX_SIZE" ]; then
              echo "... output truncated (showing last ${MAX_SIZE} bytes)"
              echo ""
              tail -c $MAX_SIZE "$file"
            else
              cat "$file"
            fi
            echo '```'
          }
          {
            echo "## Trivy Vulnerability Scan Results"
            print_report "API Image" trivy-api-results.txt
            print_report "CPU Workers Image" trivy-cpu-workers-results.txt
            print_report "GPU Workers Image" trivy-gpu-workers-results.txt
            print_report "PDF Converter Image" trivy-pdf-converter-results.txt
          } >> $GITHUB_STEP_SUMMARY
