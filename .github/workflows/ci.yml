name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      help-only: ${{ steps.filter.outputs.help-only }}
      api-tests: ${{ steps.filter.outputs.api-tests }}
      web-tests: ${{ steps.filter.outputs.web-tests }}
      pdf-converter-tests: ${{ steps.filter.outputs.pdf-converter-tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.sha }}
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          # Check if ALL changed files are under apps/help/
          if echo "$CHANGED" | grep -qvE '^apps/help/'; then
            echo "help-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "help-only=true" >> "$GITHUB_OUTPUT"
          fi
          # The API tests run only when something they exercise changed: the
          # API, the shared packages, the dependencies, the test database
          # stack or the Makefile that drives them. A chart, workflow or docs
          # change does not queue twenty minutes on the self-hosted runner.
          if echo "$CHANGED" | grep -qE '^(apps/api/|packages/|infra/database/|package\.json$|package-lock\.json$|Makefile$)'; then
            echo "api-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "api-tests=false" >> "$GITHUB_OUTPUT"
          fi
          # The web tests (vitest, no database) run when the web front, the
          # shared packages or the dependencies changed.
          if echo "$CHANGED" | grep -qE '^(apps/web/|packages/|package\.json$|package-lock\.json$)'; then
            echo "web-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "web-tests=false" >> "$GITHUB_OUTPUT"
          fi
          # The PDF converter tests (Go, with SeaweedFS for the S3 store) run
          # when the service, the SeaweedFS keys or this workflow changed.
          if echo "$CHANGED" | grep -qE '^(apps/pdf-converter/|infra/database/seaweedfs/|\.github/workflows/ci\.yml$)'; then
            echo "pdf-converter-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "pdf-converter-tests=false" >> "$GITHUB_OUTPUT"
          fi

  ci-checks:
    needs: changes
    if: needs.changes.outputs.help-only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run checks
        run: make ci-checks

  tests:
    needs: changes
    runs-on: ${{ needs.changes.outputs.api-tests == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    # One tests job at a time on the self-hosted runner, across workflows: the
    # jobs share the database ports and the connect-db compose project.
    # Queued, not cancelled.
    concurrency:
      group: tests-self-hosted
      cancel-in-progress: false
    steps:
      - name: Skip, nothing the API tests exercise changed
        if: needs.changes.outputs.api-tests == 'false'
        run: echo "Skipping the API tests, no change under apps/api, packages, infra/database, package.json, package-lock.json or Makefile"

      - name: Clean up Docker artifacts
        if: needs.changes.outputs.api-tests == 'true'
        # Only the connect-db project (infra/database) of a previous tests run.
        # The runner has two instances on one Docker daemon: the workers smoke
        # or the GPU image build of the other instance can run at this time.
        run: |
          docker ps -aq --filter label=com.docker.compose.project=connect-db | xargs -r docker rm -f -v
          sudo rm -rf infra/database/dontsave 2>/dev/null || true

      - name: Use Node.js
        if: needs.changes.outputs.api-tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Checkout code
        if: needs.changes.outputs.api-tests == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        if: needs.changes.outputs.api-tests == 'true'
        run: TEST_WORKERS=6 make tests-only-parallel

  web-tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip, nothing the web tests exercise changed
        if: needs.changes.outputs.web-tests == 'false'
        run: echo "Skipping the web tests, no change under apps/web, packages, package.json or package-lock.json"

      - name: Checkout code
        if: needs.changes.outputs.web-tests == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # After the checkout: the npm cache key is read from package-lock.json.
      - name: Use Node.js
        if: needs.changes.outputs.web-tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.web-tests == 'true'
        run: npm ci

      - name: Run web tests
        if: needs.changes.outputs.web-tests == 'true'
        run: npm run test --workspace=@caseai-connect/web

  pdf-converter-tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip, nothing the PDF converter tests exercise changed
        if: needs.changes.outputs.pdf-converter-tests == 'false'
        run: echo "Skipping the PDF converter tests, no change under apps/pdf-converter or infra/database/seaweedfs"

      - name: Checkout code
        if: needs.changes.outputs.pdf-converter-tests == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Go
        if: needs.changes.outputs.pdf-converter-tests == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/pdf-converter/go.mod
          cache-dependency-path: apps/pdf-converter/go.sum

      - name: Vet
        if: needs.changes.outputs.pdf-converter-tests == 'true'
        working-directory: apps/pdf-converter
        run: go vet ./...

      # SeaweedFS for the S3 store tests (store_s3_test.go), same image and
      # keys as infra/database. Without S3_TEST_ENDPOINT those tests skip.
      - name: Start SeaweedFS
        if: needs.changes.outputs.pdf-converter-tests == 'true'
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/infra/database/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            --health-cmd 'wget -qO- http://localhost:9333/dir/assign | grep -q fid && wget -q -O /dev/null http://localhost:8888/' \
            --health-interval 2s --health-retries 60 \
            chrislusf/seaweedfs:4.48 server -dir=/data -ip.bind=0.0.0.0 \
              -master.volumeSizeLimitMB=32 -volume.max=100 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          # The S3 port answers before a write can succeed: wait for the healthcheck.
          for attempt in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' seaweedfs)" = healthy ] && exit 0
            sleep 2
          done
          docker logs seaweedfs; exit 1

      - name: Run PDF converter tests
        if: needs.changes.outputs.pdf-converter-tests == 'true'
        working-directory: apps/pdf-converter
        run: go test ./...
        env:
          S3_TEST_ENDPOINT: http://localhost:8333
