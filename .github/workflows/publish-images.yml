name: Publish images

# On every push to main and on every release tag: the checks and the tests
# run in parallel with the build of the six container images. The images are
# published, and the deployment repository notified, only when the tests
# pass.
#
# The build pushes each image under its sha-<short sha> tag right away, a tag
# nothing consumes. The publish step then adds the tags that deployments
# follow, without a rebuild: main, latest and main-<run>-<sha> on main, the
# CalVer version on a release tag (v26.09.1 -> 26.09.1). When the tests fail,
# only the sha- tag exists.
#
# Images: ghcr.io/bayesimpact/bayes-platform/<component>:<tag>, public.
# app = the API plus the web front served under /app (target app-runtime).
# A release tag also publishes the Helm chart as an OCI artifact:
# oci://ghcr.io/bayesimpact/charts/bayes-platform.

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9][0-9].[0-9][0-9].*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  ci-checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: actions/checkout@v4

      - run: make ci-checks

  tests:
    name: tests
    runs-on: self-hosted
    # One tests job at a time on the runner: they share the Docker daemon and
    # the database ports. Queued, not cancelled.
    concurrency:
      group: tests-self-hosted
      cancel-in-progress: false
    steps:
      # Containers and volumes of a previous run. The buildx builder
      # containers stay: the persistent builder of the GPU image lives in one
      # of them, with its cache volume.
      - name: Clean up Docker artifacts of a previous run
        run: |
          docker ps -aq --format '{{.ID}} {{.Names}}' | awk '$2 !~ /^buildx_buildkit_/ { print $1 }' | xargs -r docker rm -f
          docker volume prune -f
          sudo rm -rf infra/database/dontsave 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: actions/checkout@v4

      - run: TEST_WORKERS=6 make tests-only-parallel

  # Build in parallel with the tests, pushed under the sha- tag only.
  images:
    name: build ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: apps/api/Dockerfile
            target: app-runtime
            runner: ubuntu-latest
            cache_from: |
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:app
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:cpu-workers
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:gpu-workers
          - image: cpu-workers
            dockerfile: apps/api/Dockerfile
            target: cpu-workers-runtime
            runner: ubuntu-latest
            cache_from: |
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:app
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:cpu-workers
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:gpu-workers
          # Close to 10 GB uncompressed (Torch with CUDA, Docling). Built on the
          # self-hosted runner with its persistent BuildKit builder: the
          # extracted Torch layers stay on the runner between builds, where a
          # GitHub runner re-extracts 6 GB from the registry cache every time
          # (ten minutes of the sixteen). This workflow runs on pushes to main,
          # tags and manual dispatch only, never on pull requests.
          - image: gpu-workers
            dockerfile: apps/api/Dockerfile
            target: gpu-workers-runtime
            runner: self-hosted
            builder: platform
            cache_from: |
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:app
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:cpu-workers
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:gpu-workers
          - image: pdf-converter
            dockerfile: apps/pdf-converter/Dockerfile
            target: ""
            runner: ubuntu-latest
            cache_from: |
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:pdf-converter
          - image: web-embed
            dockerfile: apps/web-embed/Dockerfile
            target: ""
            runner: ubuntu-latest
            cache_from: |
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:web-embed
          - image: help
            dockerfile: apps/help/Dockerfile
            target: ""
            runner: ubuntu-latest
            cache_from: |
              type=registry,ref=ghcr.io/bayesimpact/bayes-platform/cache:help
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        if: matrix.image == 'gpu-workers' && matrix.runner != 'self-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      # GitHub runners get a throwaway builder. The self-hosted runner has a
      # persistent one, selected by name on the build step.
      - uses: docker/setup-buildx-action@v3
        if: matrix.runner != 'self-hosted'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          # Only the candidate tag here. The deployment tags are added by the
          # publish job once the tests pass.
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          builder: ${{ matrix.builder }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit cache in the registry, all stages (mode=max): the images
          # that share a Dockerfile reuse each other's build stages, and the
          # 10 GB limit of the GitHub Actions cache does not apply (the GPU
          # image alone would evict everything).
          cache-from: ${{ matrix.cache_from }}
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/cache:${{ matrix.image }},mode=max
          provenance: true
          sbom: true

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Tests green: add the deployment tags to the six images (manifest only,
  # no rebuild) and tell the deployment repository which tag is ready. The
  # staging cluster follows main; the deployment repository turns the event
  # into a pull request on its values and Flux deploys.
  publish:
    name: publish
    needs: [ci-checks, tests, images]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tags.outputs.deploy_tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=$VERSION" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=$VERSION" >> "$GITHUB_OUTPUT"
          else
            # "main": what a chart installed from a checkout of main pulls (its
            # appVersion is "main"). main-<run number>-<sha>: sortable, the
            # same for the six images of one run, what the deployments follow.
            echo "tags=main latest main-${{ github.run_number }}-$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=main-${{ github.run_number }}-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "candidate=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Add the tags to the images
        run: |
          set -e
          for image in app cpu-workers gpu-workers pdf-converter web-embed help; do
            args=()
            for tag in ${{ steps.tags.outputs.tags }}; do
              args+=(--tag "${IMAGE_BASE}/${image}:${tag}")
            done
            docker buildx imagetools create "${args[@]}" "${IMAGE_BASE}/${image}:${{ steps.tags.outputs.candidate }}"
          done

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Dispatch platform-images-published
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/${{ github.repository_owner }}/infra/dispatches \
            -f event_type=platform-images-published \
            -f "client_payload[tag]=${{ steps.tags.outputs.deploy_tag }}" \
            -f "client_payload[sha]=${{ github.sha }}" \
            -f "client_payload[repo]=${{ github.repository }}"

  chart:
    name: helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/bayes-platform
          # The chart keeps its own semver; the app version is the release tag,
          # and it is the default image tag (see global.image.tag).
          helm package deploy/helm/bayes-platform --app-version "$VERSION" --destination dist
          helm push dist/bayes-platform-*.tgz "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
