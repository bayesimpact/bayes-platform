name: Publish images

# Builds the seven container images and pushes them to GitHub Container
# Registry, public, so any cluster can pull them without credentials:
#   ghcr.io/bayesimpact/bayes-platform/<component>:<tag>
#
# Tags: sha-<short sha> and main on every push to main, the CalVer version on a release
# tag (v26.09.1 -> 26.09.1), and latest on main. A release tag also publishes
# the Helm chart as an OCI artifact: oci://ghcr.io/bayesimpact/charts/bayes-platform.

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9][0-9].[0-9][0-9].*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: api-runtime
            runner: ubuntu-latest
          - image: cpu-workers
            dockerfile: apps/api/Dockerfile
            target: cpu-workers-runtime
            runner: ubuntu-latest
          # Close to 10 GB uncompressed (Torch with CUDA, Docling): bigger runner.
          - image: gpu-workers
            dockerfile: apps/api/Dockerfile
            target: gpu-workers-runtime
            runner: ubuntu-latest-m
          - image: pdf-converter
            dockerfile: apps/pdf-converter/Dockerfile
            target: ""
            runner: ubuntu-latest
          - image: web
            dockerfile: apps/web/Dockerfile
            target: ""
            runner: ubuntu-latest
          - image: web-embed
            dockerfile: apps/web-embed/Dockerfile
            target: ""
            runner: ubuntu-latest
          - image: help
            dockerfile: apps/help/Dockerfile
            target: ""
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        if: matrix.image == 'gpu-workers'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=match,pattern=v(.*),group=1
            # "main": what a chart installed from a checkout of main pulls
            # (its appVersion is "main"). Moves with every push, like latest.
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: true
          sbom: true

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/bayes-platform
          # The chart keeps its own semver; the app version is the release tag,
          # and it is the default image tag (see global.image.tag).
          helm package deploy/helm/bayes-platform --app-version "$VERSION" --destination dist
          helm push dist/bayes-platform-*.tgz "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
